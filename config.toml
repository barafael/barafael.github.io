# The URL the site will be built for
base_url = "https://barafael.github.io"
title = "Flipped Bits"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# ignore readmes, like the readme of the marp-theme-rhea git submodule, and
# other post build tooling that must not end up on the site
ignored_content = ["*/README.md", "*/justfile", "*/linkify.toml", "**/*.final.html", "**/*.final.pdf", "**/*.autolinked", "**/snippets.json", "*/marp-theme-rhea/**"]

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

theme = "apollo"
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
katex_enable = true

toc = true

theme = "toggle"
repo_url = "https://github.com/barafael/barafael.github.io"

socials = [
    { name = "github", url = "https://github.com/barafael/", icon = "github" },
]
stylesheets = ["custom.css"]

menu = [
    { name = "/posts", url = "/posts", weight = 1 },
    { name = "/showcase", url = "/showcase", weight = 2 },
    { name = "/cv", url = "/cv", weight = 3 },
    # { name = "/projects", url = "../projects", weight = 3 },
]

[extra.analytics]
enabled = false
