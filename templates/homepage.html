{% extends "base.html" %}

{% block main_content %}
    <main>
        <article>
            <section class="body">
                {% if section.title %}
                    {{<post.page_header title={section.title} />}}
                {% endif %}
                {{ section.content | safe }}
            </section>
        </article>
    </main>

    {% set posts_section = get_section(path="posts/_index.md") %}
    {% set posts = posts_section.pages %}
    <main class="post-list">
        {{<post.list_posts pages={posts} />}}
    </main>
{% endblock main_content %}
